  #     retries: 10
  #   networks: [backend]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${INFRA_BIND_ADDRESS}:${MINIO_API_PORT}:9000"
      - "${INFRA_BIND_ADDRESS}:${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_ASSETS: ${MINIO_BUCKET_ASSETS}
      MINIO_BUCKET_BACKUPS: ${MINIO_BUCKET_BACKUPS}
    entrypoint: >
      /bin/sh -c '
      until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 2; done;
      mc mb --ignore-existing local/"$$MINIO_BUCKET_ASSETS";
      mc mb --ignore-existing local/"$$MINIO_BUCKET_BACKUPS";
      mc anonymous set none local/"$$MINIO_BUCKET_ASSETS";
      mc anonymous set none local/"$$MINIO_BUCKET_BACKUPS";
      '
    networks: [backend]

  qdrant:
    image: qdrant/qdrant:v1.14.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
      QDRANT__SERVICE__ENABLE_TLS: "false"
    ports:
      - "${INFRA_BIND_ADDRESS}:${QDRANT_HTTP_PORT}:6333"
      - "${INFRA_BIND_ADDRESS}:${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  ocr:
    build:
      context: ./ocr
    restart: unless-stopped
    environment:
      OCR_LANGUAGE: ${OCR_LANGUAGE}
      OCR_DEVICE: ${OCR_DEVICE}
      MODEL_CACHE_DIR: /models
      # PaddleOCR ignores MODEL_CACHE_DIR and caches under $HOME/.paddleocr.
      # Point HOME at the volume so downloaded models persist across restarts.
      HOME: /models
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - ocr_models:/models
    ports:
      - "${INFRA_BIND_ADDRESS}:${OCR_PORT}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 300s
    networks: [backend]

  embedding:
    build:
      context: ./embedding
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      RERANK_MODEL: ${RERANK_MODEL}
      MODEL_CACHE_DIR: /models
      HF_HOME: /models/huggingface
      HF_ENDPOINT: ${HF_ENDPOINT:-}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    volumes:
      - embedding_models:/models
    ports:
      - "${INFRA_BIND_ADDRESS}:${EMBEDDING_PORT}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 20s
      timeout: 5s
      retries: 12
      start_period: 600s
    networks: [backend]


limit_req_zone $binary_remote_addr zone=public_request_rate:10m rate=20r/m;

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header X-Request-Id $request_id;
  }
  location /public/ {
    limit_req zone=public_request_rate burst=10 nodelay;
    proxy_pass http://api:8080/public/;
    proxy_set_header X-Request-Id $request_id;
    proxy_buffering off;
  }
  location / { try_files $uri $uri/ /index.html; }
}

name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw clean test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repos/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: repos/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Compose syntax
        run: docker compose -f infra/compose.yaml --env-file infra/.env.example config --quiet
      - name: Reject runtime artifacts and obvious plaintext credentials
        run: |
          ! git ls-files | grep -E '(^|/)(\.idea/|.*\.(log|iml)$|package-lock\.json\.bak$)'
          ! git grep -nE '(admin123|admin@hardware\.ai)' -- ':!docs/**' ':!**/*.md'
